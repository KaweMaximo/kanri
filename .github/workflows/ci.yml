# ============================================================================
#  CI do Kanri — roda em todo push na main e em todo Pull Request
# ============================================================================
#  Cinco jobs independentes, em paralelo:
#    1. testes    -> pio test -e native   (122 casos, com -Werror)
#    2. cobertura -> exige 100% de linhas em lib/
#    3. politica  -> mexer em lib/ sem mexer em test/ e bloqueado
#    4. changelog -> mudanca de codigo/infra sem CHANGELOG.md e bloqueada
#    5. firmware  -> pio run -e esp32dev  (compila de verdade para o ESP32)
#    6. commits   -> valida Conventional Commits
#
#  A regra do projeto: merge na main SO com os seis verdes.
#  Isso e configurado no GitHub (Settings > Branches), nao aqui.
#  Ver CONTRIBUTING.md e docs/TESTING.md.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite rodar o CI a mao, em qualquer branch, pela aba Actions ou por
  #     gh workflow run CI --ref main
  #
  # Serve para dois casos reais:
  #  - o GitHub as vezes perde o evento e o run nao dispara sozinho (aconteceu
  #    na criacao deste repo); sem isso, a unica saida e um commit vazio;
  #  - reverificar a main depois de mexer em cache, dependencia ou runner,
  #    sem precisar inventar um commit.
  workflow_dispatch:

# Se um novo commit chegar no mesmo PR, cancela a execucao anterior.
# Economiza minutos de runner e evita resultado de codigo desatualizado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  #  1. Testes unitarios — o job mais importante. Roda a logica pura no
  #     runner, sem ESP32. Rapido, entao da retorno quase imediato no PR.
  # --------------------------------------------------------------------------
  testes:
    name: Testes unitários (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sem cache, cada execucao rebaixa as dependencias. A chave inclui o
      # hash do platformio.ini: se ele mudar, cache novo.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-native-

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Rodar testes
        run: pio test -e native -v

  # --------------------------------------------------------------------------
  #  2. Cobertura — a espinha dorsal da politica de testes.
  #
  #  Exige 100% de cobertura de LINHAS em lib/. Consequencia direta: uma
  #  linha nova sem teste que a execute deixa o CI vermelho. E assim que
  #  "todo desenvolvimento novo tem teste" para de ser combinado e passa a
  #  ser regra cobrada pela maquina.
  #
  #  Ramos (branches) ficam em 90%: alguns ramos de compilador nao sao
  #  alcancaveis de forma razoavel, e um limite rigido ali gera ruido em vez
  #  de qualidade.
  # --------------------------------------------------------------------------
  cobertura:
    name: Cobertura (100% linhas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-cov-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cov-

      - name: Instalar PlatformIO e gcovr
        run: pip install --upgrade platformio gcovr

      - name: Rodar testes instrumentados
        run: pio test -e native_coverage

      - name: Verificar cobertura
        run: |
          gcovr --root . \
                --filter 'lib/.*' \
                --exclude '.*\.h$' \
                --print-summary \
                --fail-under-line 100 \
                --fail-under-branch 90 \
                --txt

      # Relatorio no resumo do PR, para ver a lacuna sem baixar nada.
      - name: Publicar resumo
        if: always()
        run: |
          {
            echo '## Cobertura de testes'
            echo ''
            echo '```'
            gcovr --root . --filter 'lib/.*' --exclude '.*\.h$' --txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatório HTML
        if: always()
        run: |
          gcovr --root . --filter 'lib/.*' --exclude '.*\.h$' \
                --html-details cobertura.html || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-de-cobertura
          path: cobertura*.html
          retention-days: 14

  # --------------------------------------------------------------------------
  #  3. Politica de testes — mexer em lib/ sem mexer em test/ e bloqueado.
  #
  #  A cobertura (job 2) ja pega quase tudo, mas nao pega o caso de ALTERAR
  #  o comportamento de uma linha que ja era coberta. Este job cobre isso.
  #
  #  Valvula de escape: label `sem-teste-necessario` no PR. A dispensa fica
  #  registrada e visivel na revisao — nao e um --no-verify invisivel.
  # --------------------------------------------------------------------------
  politica:
    name: Política de testes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se código novo veio com teste
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DISPENSADO: ${{ contains(github.event.pull_request.labels.*.name, 'sem-teste-necessario') }}
        run: |
          set -euo pipefail

          MUDOU_LIB=$(git diff --name-only "$BASE" "$HEAD" \
                        -- 'lib/**/*.cpp' 'lib/**/*.h' | wc -l)
          MUDOU_TEST=$(git diff --name-only "$BASE" "$HEAD" \
                        -- 'test/**' | wc -l)

          echo "arquivos alterados em lib/  : $MUDOU_LIB"
          echo "arquivos alterados em test/ : $MUDOU_TEST"
          echo "label sem-teste-necessario  : $DISPENSADO"

          if [ "$MUDOU_LIB" -eq 0 ]; then
            echo "Nada mudou em lib/. Nada a exigir."
            exit 0
          fi

          if [ "$MUDOU_TEST" -gt 0 ]; then
            echo "OK: lib/ mudou e test/ tambem."
            exit 0
          fi

          if [ "$DISPENSADO" = "true" ]; then
            echo "AVISO: dispensado pela label 'sem-teste-necessario'."
            echo "A dispensa fica registrada no PR para a revisao avaliar."
            exit 0
          fi

          cat <<'FIM'

            ✗ Este PR altera lib/ sem alterar nada em test/.

            Politica do projeto: codigo novo em lib/ chega com teste.
            Ver docs/TESTING.md.

            O que fazer:
              - adicione ou ajuste o teste em test/test_<coisa>/
              - rode localmente:  pio test -e native

            Se a mudanca realmente nao pede teste (so comentario, so
            renomear, so #include), adicione a label:

                sem-teste-necessario

            A dispensa fica visivel na revisao — de proposito.

          FIM
          exit 1

  # --------------------------------------------------------------------------
  #  4. CHANGELOG — mudanca de codigo ou de infra tem de registrar o que mudou.
  #
  #  Por que cobrar isso? Porque um changelog lembrado so na hora do release
  #  ja nasceu incompleto: ninguem reconstroi, tres meses depois, o que cada
  #  commit significava para quem usa o firmware. O momento em que se sabe o
  #  que mudou e o momento do PR.
  #
  #  So exige para mudanca de codigo/infra. PR de documentacao pura nao entra
  #  na regra — corrigir typo em doc nao e nota de release.
  #
  #  Valvula de escape: label `sem-changelog`, visivel na revisao.
  # --------------------------------------------------------------------------
  changelog:
    name: CHANGELOG atualizado
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar registro no CHANGELOG
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DISPENSADO: ${{ contains(github.event.pull_request.labels.*.name, 'sem-changelog') }}
        run: |
          set -euo pipefail

          MUDOU_CODIGO=$(git diff --name-only "$BASE" "$HEAD" \
                          -- 'lib/**' 'src/**' 'test/**' 'tools/**' \
                             'platformio.ini' 'start.sh' \
                             '.github/workflows/**' | wc -l)
          MUDOU_CHANGELOG=$(git diff --name-only "$BASE" "$HEAD" \
                          -- 'CHANGELOG.md' | wc -l)

          echo "arquivos de codigo/infra alterados : $MUDOU_CODIGO"
          echo "CHANGELOG.md alterado             : $MUDOU_CHANGELOG"
          echo "label sem-changelog               : $DISPENSADO"

          if [ "$MUDOU_CODIGO" -eq 0 ]; then
            echo "Nenhuma mudanca de codigo ou infra. Nada a exigir."
            exit 0
          fi

          if [ "$MUDOU_CHANGELOG" -gt 0 ]; then
            echo "OK: codigo mudou e o CHANGELOG foi atualizado."
            # Aviso (nao falha): a secao [Nao lancado] parece vazia?
            if grep -qiE '^\s*Nada ainda' CHANGELOG.md; then
              echo "::warning::A secao [Nao lancado] do CHANGELOG parece vazia. Confira se a entrada foi para o lugar certo."
            fi
            exit 0
          fi

          if [ "$DISPENSADO" = "true" ]; then
            echo "AVISO: dispensado pela label 'sem-changelog'."
            exit 0
          fi

          cat <<'FIM'

            ✗ Este PR altera codigo ou infra sem atualizar o CHANGELOG.md.

            Politica do projeto: toda mudanca de codigo ou de infra registra o
            que mudou, no mesmo PR. Um changelog lembrado so na hora do release
            ja nasceu incompleto.

            O que fazer: acrescente uma entrada na secao [Nao lancado] do
            CHANGELOG.md, escrita para quem vai LER daqui a seis meses — nao
            uma copia da mensagem de commit.

                ## [Nao lancado]

                ### Adicionado
                - suporte a leitura do PID 0x0C (rotacao do motor)

            Secoes: Adicionado, Modificado, Descontinuado, Removido,
                    Corrigido, Seguranca.

            Se a mudanca realmente nao merece registro, adicione a label:

                sem-changelog

            Ver CONTRIBUTING.md secao "O CHANGELOG".

          FIM
          exit 1

  # --------------------------------------------------------------------------
  #  5. Build do firmware — testes passando NAO provam que compila para o
  #     hardware: a logica compila com g++, o firmware com
  #     xtensa-esp32-elf-gcc.
  # --------------------------------------------------------------------------
  firmware:
    name: Build do firmware (esp32dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-esp32-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-esp32-

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar
        run: pio run -e esp32dev

      # Uso de flash e RAM no log. Vale acompanhar: em firmware, ficar sem
      # flash e problema real, e o crescimento e gradual ate nao caber mais.
      - name: Uso de memória
        run: pio run -e esp32dev -t size

  # --------------------------------------------------------------------------
  #  6. Conventional Commits — mensagem padronizada permite gerar CHANGELOG
  #     e deixa `git log` legivel meses depois.
  # --------------------------------------------------------------------------
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar mensagens dos commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|test|refactor|chore|perf|build|ci|style|revert)(\([a-z0-9._-]+\))?!?: .{1,}'
          FAILED=0

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            # Commits de merge sao gerados pelo Git, nao seguem o padrao.
            case "$subject" in "Merge "*) continue ;; esac

            if printf '%s' "$subject" | grep -qE "$PATTERN"; then
              echo "  ok   $subject"
            else
              echo "  ERRO $subject"
              FAILED=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Mensagem de commit fora do padrao Conventional Commits."
            echo "Formato: <tipo>(<escopo>): <descricao>"
            echo "Exemplo: feat(obd): adiciona decodificacao do PID 0x0C"
            echo ""
            echo "Tipos: feat fix docs test refactor chore perf build ci style revert"
            echo "Ver CLAUDE.md secao Git."
            exit 1
          fi
