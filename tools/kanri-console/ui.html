<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanri Console</title>
<style>
  :root {
    --bg: #0e1116; --painel: #161b22; --borda: #2a313c;
    --txt: #e6edf3; --txt2: #8b949e;
    --ok: #3fb950; --alerta: #d29922; --erro: #f85149;
    --azul: #58a6ff; --roxo: #bc8cff;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --painel:#fff; --borda:#d8dee4; --txt:#1f2328; --txt2:#59636e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--painel);
    border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 5;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  h1 span { color: var(--txt2); font-weight: 400; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--borda); background: var(--bg);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--txt2); }
  .dot.on  { background: var(--ok);  box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--erro); }
  .dot.busy{ background: var(--alerta); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35 } }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 14px; padding: 14px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--painel); border: 1px solid var(--borda);
    border-radius: 10px; padding: 14px;
  }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--txt2); margin: 0 0 10px; font-weight: 600;
  }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 13px; }
  .kv + .kv { border-top: 1px dashed var(--borda); }
  .kv b { font-weight: 500; color: var(--txt2); }
  .kv span { font-family: var(--mono); font-size: 12px; text-align: right; word-break: break-all; }
  .estado {
    font-family: var(--mono); font-size: 20px; font-weight: 600;
    padding: 12px; border-radius: 8px; text-align: center;
    background: var(--bg); border: 1px solid var(--borda); margin-bottom: 10px;
  }
  .estado.ok    { color: var(--ok);     border-color: var(--ok); }
  .estado.warn  { color: var(--alerta); border-color: var(--alerta); }
  .estado.bad   { color: var(--erro);   border-color: var(--erro); }
  .botoes { display: grid; gap: 8px; }
  button {
    font: inherit; font-size: 13px; padding: 9px 12px; cursor: pointer;
    background: var(--bg); color: var(--txt);
    border: 1px solid var(--borda); border-radius: 7px;
    display: flex; align-items: center; gap: 8px; transition: .12s;
  }
  button:hover:not(:disabled) { border-color: var(--azul); color: var(--azul); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primario { border-color: var(--ok); color: var(--ok); }
  button.primario:hover:not(:disabled) { background: color-mix(in srgb, var(--ok) 12%, transparent); }
  #logCard { padding: 0; display: flex; flex-direction: column; min-height: 60vh; }
  .logbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--borda);
  }
  .logbar label { font-size: 12px; color: var(--txt2); display: flex; align-items: center; gap: 5px; }
  #log {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    max-height: 70vh;
  }
  .linha { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; }
  .linha .t { color: var(--txt2); flex-shrink: 0; opacity: .65; }
  .tipo-serial  { color: var(--txt); }
  .tipo-cmd     { color: var(--roxo); }
  .tipo-info    { color: var(--azul); }
  .tipo-ok      { color: var(--ok); font-weight: 600; }
  .tipo-erro    { color: var(--erro); font-weight: 600; }
  .destaque-estado { color: var(--azul); font-weight: 600; }
  .destaque-retry  { color: var(--alerta); }
  .vazio { color: var(--txt2); padding: 30px; text-align: center; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Kanri <span>Console</span></h1>
  <div class="pill"><span class="dot" id="dotSerial"></span><span id="lblSerial">conectando…</span></div>
  <div class="pill"><span class="dot" id="dotStream"></span><span id="lblStream">stream</span></div>
  <div class="pill" id="pillPorta" style="font-family:var(--mono)">—</div>
</header>

<main>
  <div>
    <div class="card" style="margin-bottom:14px">
      <h2>Estado do firmware</h2>
      <div class="estado" id="estadoFw">—</div>
      <div class="kv"><b>Último evento</b><span id="kvEvento">—</span></div>
      <div class="kv"><b>Versão</b><span id="kvVersao">—</span></div>
      <div class="kv"><b>Tentativa</b><span id="kvTentativa">—</span></div>
      <div class="kv"><b>Próx. retry</b><span id="kvRetry">—</span></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <h2>Conexão</h2>
      <div class="kv"><b>Porta</b><span id="kvPorta">—</span></div>
      <div class="kv"><b>Serial</b><span id="kvAberta">—</span></div>
      <div class="kv"><b>Baud</b><span id="kvBaud">—</span></div>
      <div class="kv"><b>PlatformIO</b><span id="kvPio">—</span></div>
    </div>

    <div class="card">
      <h2>Ações</h2>
      <div class="botoes">
        <button class="primario" id="btFlash">⬆️ Gravar firmware</button>
        <button id="btReset">🔄 Reiniciar ESP32</button>
        <button id="btBuild">🔨 Compilar</button>
        <button id="btTest">🧪 Rodar testes</button>
        <button id="btChip">🔍 Detectar chip</button>
        <button id="btClear">🧹 Limpar log</button>
      </div>
    </div>
  </div>

  <div class="card" id="logCard">
    <div class="logbar">
      <strong style="font-size:12px">LOG AO VIVO</strong>
      <label><input type="checkbox" id="chkAuto" checked> auto-scroll</label>
      <label><input type="checkbox" id="chkSerial" checked> serial</label>
      <label><input type="checkbox" id="chkCmd" checked> comandos</label>
      <span style="margin-left:auto;color:var(--txt2);font-size:12px" id="contador">0 linhas</span>
    </div>
    <div id="log"><div class="vazio">Aguardando dados do ESP32…</div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const log = $('log');
let total = 0, ocupado = false;

const ESTADOS_OK   = ['Polling'];
const ESTADOS_WARN = ['Degraded', 'ScanningAdapter', 'ConnectingAdapter',
                      'InitializingElm', 'ConnectingVehicle', 'LoadingConfig', 'Boot'];
const ESTADOS_BAD  = ['Fault'];

function hora(t) {
  const d = new Date(t * 1000);
  return d.toLocaleTimeString('pt-BR', {hour12:false}) + '.' +
         String(d.getMilliseconds()).padStart(3,'0');
}

function tipoVisivel(tipo) {
  if (tipo === 'serial') return $('chkSerial').checked;
  if (tipo === 'cmd')    return $('chkCmd').checked;
  return true;
}

function addLinha(ev) {
  if (total === 0) log.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'linha tipo-' + ev.tipo;
  div.dataset.tipo = ev.tipo;
  if (!tipoVisivel(ev.tipo)) div.style.display = 'none';

  const t = document.createElement('span');
  t.className = 't';
  t.textContent = hora(ev.t);

  const txt = document.createElement('span');
  // Destaca as linhas estruturadas do firmware
  if (ev.texto.includes('[estado]')) txt.className = 'destaque-estado';
  else if (ev.texto.includes('[retry]')) txt.className = 'destaque-retry';
  txt.textContent = ev.texto;

  div.append(t, txt);
  log.appendChild(div);
  total++;
  $('contador').textContent = total + ' linhas';

  while (log.children.length > 1200) log.removeChild(log.firstChild);
  if ($('chkAuto').checked) log.scrollTop = log.scrollHeight;
}

// -- SSE: o servidor empurra cada linha assim que ela chega ------------------
let es;
function conectarStream() {
  es = new EventSource('/api/stream');
  es.onopen = () => {
    $('dotStream').className = 'dot on';
    $('lblStream').textContent = 'stream ativo';
  };
  es.onmessage = e => addLinha(JSON.parse(e.data));
  es.onerror = () => {
    $('dotStream').className = 'dot off';
    $('lblStream').textContent = 'stream caiu — reconectando';
  };
}

async function atualizarStatus() {
  try {
    const s = await (await fetch('/api/status')).json();

    const aberta = s.serial_aberta;
    $('dotSerial').className = 'dot ' + (s.pausado ? 'busy' : aberta ? 'on' : 'off');
    $('lblSerial').textContent = s.pausado ? 'porta cedida ao comando'
                               : aberta ? 'ESP32 conectado' : 'ESP32 desconectado';
    $('pillPorta').textContent = s.porta || 'sem porta';

    const e = s.estado_fw || '—';
    const el = $('estadoFw');
    el.textContent = e;
    el.className = 'estado ' + (ESTADOS_OK.includes(e) ? 'ok'
                              : ESTADOS_BAD.includes(e) ? 'bad'
                              : ESTADOS_WARN.includes(e) ? 'warn' : '');

    $('kvEvento').textContent    = s.ultimo_evento || '—';
    $('kvVersao').textContent    = s.versao_fw || '—';
    $('kvTentativa').textContent = s.tentativa ? '#' + s.tentativa : '—';
    $('kvRetry').textContent     = s.proximo_retry_ms ? s.proximo_retry_ms + ' ms' : '—';
    $('kvPorta').textContent     = s.porta || 'não detectada';
    $('kvAberta').textContent    = s.pausado ? 'cedida' : aberta ? 'aberta' : 'fechada';
    $('kvBaud').textContent      = s.baud;
    $('kvPio').textContent       = s.pio ? 'ok' : 'não encontrado';
  } catch (_) {
    $('dotSerial').className = 'dot off';
    $('lblSerial').textContent = 'painel offline';
  }
}

async function acao(rota, botao) {
  if (ocupado) return;
  ocupado = true;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  const antes = botao ? botao.textContent : '';
  if (botao) botao.textContent = '⏳ executando…';
  try {
    await fetch(rota, {method: 'POST'});
  } finally {
    // Os comandos rodam em background no servidor; liberamos a UI depois de
    // um instante para que o log comece a aparecer.
    setTimeout(() => {
      ocupado = false;
      document.querySelectorAll('button').forEach(b => b.disabled = false);
      if (botao) botao.textContent = antes;
    }, 1200);
  }
}

$('btFlash').onclick = e => acao('/api/flash', e.target);
$('btReset').onclick = e => acao('/api/reset', e.target);
$('btBuild').onclick = e => acao('/api/build', e.target);
$('btTest').onclick  = e => acao('/api/test',  e.target);
$('btChip').onclick  = e => acao('/api/chip',  e.target);
$('btClear').onclick = async () => {
  await fetch('/api/clear', {method: 'POST'});
  log.innerHTML = '<div class="vazio">Log limpo.</div>';
  total = 0; $('contador').textContent = '0 linhas';
};

for (const id of ['chkSerial', 'chkCmd']) {
  $(id).onchange = () => {
    for (const el of log.children) {
      if (el.dataset && el.dataset.tipo) {
        el.style.display = tipoVisivel(el.dataset.tipo) ? '' : 'none';
      }
    }
  };
}

conectarStream();
atualizarStatus();
setInterval(atualizarStatus, 1000);
</script>
</body>
</html>
