; ============================================================================
;  Kanri (管理) — Telemetria OBD2 para Mitsubishi Lancer 2.0 2014 (4B11)
; ============================================================================
;  Este arquivo e o "centro de controle" do PlatformIO. Ele define AMBIENTES
;  (environments). Cada ambiente e uma combinacao de: plataforma + placa +
;  framework + flags de compilacao.
;
;  Temos dois ambientes:
;    [env:esp32dev] -> compila o firmware de verdade, para gravar no ESP32.
;    [env:native]   -> compila SO a logica pura (sem hardware) e roda os
;                      testes unitarios no seu PC com o g++ do Linux.
;
;  Comandos do dia a dia:
;    pio run   -e esp32dev            -> compila o firmware
;    pio run   -e esp32dev -t upload  -> grava no ESP32 via USB
;    pio device monitor               -> abre o serial monitor
;    pio test  -e native              -> roda os testes unitarios no PC
; ============================================================================

[platformio]
default_envs = esp32dev
description = Firmware ESP32 de telemetria OBD2 read-only via ELM327 Bluetooth

; ----------------------------------------------------------------------------
; [common] nao e um ambiente. E um bloco reutilizavel: os ambientes abaixo
; herdam dele com a sintaxe ${common.chave}. Evita repeticao.
; ----------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow

; Todas as bibliotecas locais (pasta lib/) que o projeto usa.
; Declarar explicitamente e mais previsivel do que confiar apenas na deteccao
; automatica do PlatformIO (o "Library Dependency Finder").
lib_deps_local =
    kanri_obd
    kanri_config
    kanri_display
    kanri_core

; ----------------------------------------------------------------------------
; FIRMWARE — ESP32 classico (ESP32-WROOM-32 / DevKit v1)
;
; ATENCAO: tem que ser ESP32 "classico". ESP32-S3, ESP32-C3 e ESP32-C6 NAO
; possuem Bluetooth Classic (SPP), somente BLE. A grande maioria dos
; adaptadores ELM327 baratos usa Bluetooth Classic SPP. Ver docs/HARDWARE.md.
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.9.0   ; versao FIXA de proposito: builds reproduziveis
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3        ; 0=nada ... 5=verboso. 3 = info
lib_deps = ${common.lib_deps_local}
lib_ldf_mode = deep+

; ----------------------------------------------------------------------------
; TESTES UNITARIOS — rodam no seu PC, sem ESP32 conectado
;
; Como funciona: o PlatformIO compila as libs de lib/ com o g++ do Linux e
; linka com o framework de teste Unity. Por isso a REGRA DE OURO do projeto:
;   -> a logica de negocio em lib/ NAO pode incluir <Arduino.h>.
; Todo codigo que toca hardware fica em src/hal/ (ver docs/ARCHITECTURE.md).
;
; test_build_src = no  -> a pasta src/ (que tem Arduino.h) fica de fora.
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -Werror                    ; nos testes, warning = erro. Disciplina.
    -DKANRI_HOST_BUILD=1       ; permite #ifdef para codigo so-de-host
    -I test/helpers            ; dubles de teste (fakes)
lib_deps = ${common.lib_deps_local}
lib_ldf_mode = deep+
test_build_src = no
